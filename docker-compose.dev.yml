services:
  hisab_db:
    image: postgres:16-alpine
    container_name: hisab-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hisab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hisab}
      POSTGRES_DB: ${POSTGRES_DB:-hisab}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-hisab}
      interval: 5s
      retries: 5
    volumes:
      - hisab-pgdata-dev:/var/lib/postgresql/data

  # Ephemeral Postgres for `npm test` (integration tests, port 5435).
  db_test:
    image: postgres:16-alpine
    container_name: hisab-db-test
    environment:
      POSTGRES_USER: hisab
      POSTGRES_PASSWORD: hisab
      POSTGRES_DB: hisab_test
    ports: ["127.0.0.1:5435:5432"]
    tmpfs:
      - /var/lib/postgresql/data

  hisab:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hisab-app-dev
    depends_on:
      hisab_db:
        condition: service_healthy
    ports: ["3000:3000"]
    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      # DATABASE_URL, AUTH_SECRET, AUTH_URL, ADMIN_EMAIL, ADMIN_PASSWORD are
      # fetched from Infisical by scripts/docker-entrypoint.sh at startup
      # (which also runs migrations and seeds the admin user for dev).
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ["npx", "next", "dev", "--hostname", "0.0.0.0"]

volumes:
  hisab-pgdata-dev:
