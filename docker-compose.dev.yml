services:
  postgres:
    image: postgres:16-alpine
    container_name: hisab-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hisab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hisab}
      POSTGRES_DB: ${POSTGRES_DB:-hisab}
    ports: ["5432:5432"]
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-hisab}
      interval: 5s
      retries: 5
    volumes:
      - hisab-pgdata-dev:/var/lib/postgresql/data

  # Ephemeral Postgres for `npm test` (integration tests, port 5433).
  db_test:
    image: postgres:16-alpine
    container_name: hisab-db-test
    environment:
      POSTGRES_USER: hisab
      POSTGRES_PASSWORD: hisab
      POSTGRES_DB: hisab_test
    ports: ["5434:5432"]
    tmpfs:
      - /var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hisab-app-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hisab}:${POSTGRES_PASSWORD:-hisab}@postgres:5432/${POSTGRES_DB:-hisab}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-do-not-use-in-production}
      AUTH_URL: http://localhost:${APP_PORT:-3000}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hisab.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-hisab-dev-password}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "npx prisma migrate deploy && npm run db:seed && npx next dev --hostname 0.0.0.0"

volumes:
  hisab-pgdata-dev:
