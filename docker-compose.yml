services:
  postgres:
    image: postgres:16-alpine
    container_name: hisab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hisab
      POSTGRES_PASSWORD: hisab
      POSTGRES_DB: hisab
    ports:
      - "5432:5432"
    volumes:
      - hisab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisab"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hisab-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hisab:hisab@postgres:5432/hisab
      AUTH_SECRET: dev-secret-do-not-use-in-production
      AUTH_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  hisab-pgdata:
