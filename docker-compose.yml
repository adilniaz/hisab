services:
  postgres:
    image: postgres:16-alpine
    container_name: hisab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      retries: 10
    volumes:
      - hisab-pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hisab-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Host port 3002: cookbook holds 3000 and bake_em_up holds 3001 in prod —
    # see CADDY-DEPLOYMENT.md §1 (Option B, distinct host ports).
    ports: ["3002:3000"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}"
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: ${AUTH_URL:?}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      # Admin seed is a manual post-deploy step:
      #   docker compose exec app npx tsx prisma/seed.ts
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  hisab-pgdata:
